# Crux: full stack on one host (backend-spec section 1).
# Local:  docker compose -f deploy/compose.yaml --env-file .env up --build   (or: make up)
# Only the gateway listens beyond this machine: MySQL, Redis, the object store and Mailpit are
# published on 127.0.0.1 for local tools (CRUX_BIND_HOST to change that), never on every
# interface (audit C2).
# Profiles: "ai" adds the ai service + worker (the non-AI product runs without it, spec 1 / 9.6);
#           "monitoring" adds Grafana + Loki (later milestone).

name: crux

x-python-env: &python-env
  CRUX_ENV: ${CRUX_ENV:-dev}
  CRUX_REDIS_URL: redis://:${CRUX_REDIS_PASSWORD:-crux-redis-dev}@redis:6379/0
  CRUX_CORE_INTERNAL_URL: http://core:8080
  CRUX_JWKS_URL: http://core:8080/internal/v1/jwks
  CRUX_S3_ENDPOINT: http://s3:8333
  CRUX_S3_ACCESS_KEY: ${CRUX_S3_ACCESS_KEY:-crux}
  CRUX_S3_SECRET_KEY: ${CRUX_S3_SECRET_KEY:-crux-dev-secret}
  CRUX_S3_BUCKET: crux-files
  CRUX_S3_PUBLIC_ENDPOINT: ${CRUX_APP_BASE_URL:-http://localhost:8000}
  CRUX_APP_BASE_URL: ${CRUX_APP_BASE_URL:-http://localhost:8000}
  # D2-7: fake (EICAR-aware) scanner in dev; set clamd and start the "full" profile for ClamAV.
  CRUX_SCANNER: ${CRUX_SCANNER:-fake}
  CRUX_CLAMD_HOST: clamav
  CRUX_SERVICE_SECRET: ${CRUX_SERVICE_SECRET:-dev-service-secret-change-me}

services:
  gateway:
    restart: unless-stopped
    image: caddy:2.8
    ports: ["${CRUX_HTTP_PORT:-8000}:80"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The web app build (`make web`); the demo console is served at /demo in dev only.
      - ${CRUX_WEB_DIR:-../web/dist}:/srv/web:ro
      - ../demo:/srv/demo:ro
    environment:
      CRUX_SITE_ADDRESS: ${CRUX_SITE_ADDRESS:-:80}
      CRUX_ENV: ${CRUX_ENV:-dev}
    depends_on:
      core: {condition: service_healthy}
      files: {condition: service_healthy}
      notify: {condition: service_healthy}

  mysql:
    restart: unless-stopped
    image: mysql:8.0.40
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-crux-root}
      CRUX_ENV: ${CRUX_ENV:-dev}
      CRUX_CORE_DB_PASSWORD: ${CRUX_CORE_DB_PASSWORD:-crux-core}
      CRUX_FILES_DB_PASSWORD: ${CRUX_FILES_DB_PASSWORD:-crux-files}
      CRUX_AI_DB_PASSWORD: ${CRUX_AI_DB_PASSWORD:-crux-ai}
      CRUX_NOTIFY_DB_PASSWORD: ${CRUX_NOTIFY_DB_PASSWORD:-crux-notify}
    ports: ["${CRUX_BIND_HOST:-127.0.0.1}:${CRUX_MYSQL_PORT:-3306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./mysql/init-prod.sh:/docker-entrypoint-initdb.d/01-passwords.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-crux-root}"]
      interval: 5s
      retries: 30

  redis:
    restart: unless-stopped
    image: redis:7.4
    command: ["redis-server", "--requirepass", "${CRUX_REDIS_PASSWORD:-crux-redis-dev}"]
    environment:
      # redis-cli inside the container (healthcheck, `make unlock`) authenticates with this.
      REDISCLI_AUTH: ${CRUX_REDIS_PASSWORD:-crux-redis-dev}
    ports: ["${CRUX_BIND_HOST:-127.0.0.1}:${CRUX_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # S3-compatible object store (spec 1 names MinIO; its images are no longer published, see
  # OPEN-QUESTIONS.md S-7). Its one identity is written at start from CRUX_S3_* (audit C1: the
  # keys used to sit in a committed file).
  s3:
    restart: unless-stopped
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"crux","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'           "$$CRUX_S3_ACCESS_KEY" "$$CRUX_S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      CRUX_S3_ACCESS_KEY: ${CRUX_S3_ACCESS_KEY:-crux}
      CRUX_S3_SECRET_KEY: ${CRUX_S3_SECRET_KEY:-crux-dev-secret}
    ports: ["${CRUX_BIND_HOST:-127.0.0.1}:${CRUX_S3_PORT:-8333}:8333"]
    volumes:
      - s3-data:/data

  clamav:
    restart: unless-stopped
    image: clamav/clamav:1.4
    profiles: ["full"]

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.20
    ports: ["${CRUX_BIND_HOST:-127.0.0.1}:8025:8025"]

  core:
    restart: unless-stopped
    build: {context: .., dockerfile: core/Dockerfile}
    environment:
      CRUX_ENV: ${CRUX_ENV:-dev}
      CRUX_DATABASE_URL: mysql://crux_core:${CRUX_CORE_DB_PASSWORD:-crux-core}@mysql:3306/crux_core
      CRUX_REDIS_URL: redis://:${CRUX_REDIS_PASSWORD:-crux-redis-dev}@redis:6379/0
      CRUX_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_ed25519.pem
      CRUX_SERVICE_SECRET: ${CRUX_SERVICE_SECRET:-dev-service-secret-change-me}
      CRUX_COOKIE_SECURE: ${CRUX_COOKIE_SECURE:-false}
      CRUX_AI_INTERNAL_URL: http://ai:8080
      CRUX_APP_BASE_URL: ${CRUX_APP_BASE_URL:-http://localhost:8000}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Ready = answering HTTP: `up --wait` and the gateway wait for it (no request races start-up).
    healthcheck:
      test: ["CMD", "crux-core", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  core-jobs:
    restart: unless-stopped
    build: {context: .., dockerfile: core/Dockerfile}
    command: ["crux-core", "jobs"]
    environment:
      CRUX_DATABASE_URL: mysql://crux_core:${CRUX_CORE_DB_PASSWORD:-crux-core}@mysql:3306/crux_core
      CRUX_REDIS_URL: redis://:${CRUX_REDIS_PASSWORD:-crux-redis-dev}@redis:6379/0
      CRUX_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_ed25519.pem
      CRUX_SERVICE_SECRET: ${CRUX_SERVICE_SECRET:-dev-service-secret-change-me}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on: [core]

  files:
    restart: unless-stopped
    build: {context: .., dockerfile: services/Dockerfile, args: {SERVICE: files}}
    environment:
      <<: *python-env
      CRUX_DATABASE_URL: mysql+aiomysql://crux_files:${CRUX_FILES_DB_PASSWORD:-crux-files}@mysql:3306/crux_files
      CRUX_SERVICE_NAME: files
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      s3: {condition: service_started}
    # Ready = answering HTTP: `up --wait` and the gateway wait for it (no request races start-up).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  files-worker:
    restart: unless-stopped
    build: {context: .., dockerfile: services/Dockerfile, args: {SERVICE: files}}
    command: ["python", "-m", "app.jobs"]
    environment:
      <<: *python-env
      CRUX_DATABASE_URL: mysql+aiomysql://crux_files:${CRUX_FILES_DB_PASSWORD:-crux-files}@mysql:3306/crux_files
      CRUX_SERVICE_NAME: files
    depends_on: [files, s3]

  notify:
    restart: unless-stopped
    build: {context: .., dockerfile: services/Dockerfile, args: {SERVICE: notify}}
    environment:
      <<: *python-env
      CRUX_DATABASE_URL: mysql+aiomysql://crux_notify:${CRUX_NOTIFY_DB_PASSWORD:-crux-notify}@mysql:3306/crux_notify
      CRUX_SERVICE_NAME: notify
      CRUX_UNSUBSCRIBE_SECRET: ${CRUX_UNSUBSCRIBE_SECRET:-dev-unsubscribe-secret-change-me}
      CRUX_EMAIL_WEBHOOK_SECRET: ${CRUX_EMAIL_WEBHOOK_SECRET:-}
      CRUX_SMTP_URL: ${CRUX_SMTP_URL:-smtp://mailpit:1025}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Ready = answering HTTP: `up --wait` and the gateway wait for it (no request races start-up).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  notify-worker:
    restart: unless-stopped
    build: {context: .., dockerfile: services/Dockerfile, args: {SERVICE: notify}}
    command: ["python", "-m", "app.jobs"]
    environment:
      <<: *python-env
      CRUX_DATABASE_URL: mysql+aiomysql://crux_notify:${CRUX_NOTIFY_DB_PASSWORD:-crux-notify}@mysql:3306/crux_notify
      CRUX_SERVICE_NAME: notify
      CRUX_UNSUBSCRIBE_SECRET: ${CRUX_UNSUBSCRIBE_SECRET:-dev-unsubscribe-secret-change-me}
      CRUX_EMAIL_WEBHOOK_SECRET: ${CRUX_EMAIL_WEBHOOK_SECRET:-}
      CRUX_SMTP_URL: ${CRUX_SMTP_URL:-smtp://mailpit:1025}
      CRUX_DISPATCH_INTERVAL_SECONDS: ${CRUX_DISPATCH_INTERVAL_SECONDS:-30}
    depends_on: [notify]

  ai:
    restart: unless-stopped
    profiles: ["ai"]
    build: {context: .., dockerfile: services/Dockerfile, args: {SERVICE: ai}}
    environment:
      <<: *python-env
      CRUX_DATABASE_URL: mysql+aiomysql://crux_ai:${CRUX_AI_DB_PASSWORD:-crux-ai}@mysql:3306/crux_ai
      CRUX_SERVICE_NAME: ai
      CRUX_KMS_MASTER_KEY: ${CRUX_KMS_MASTER_KEY:-ZGV2LW9ubHktbWFzdGVyLWtleS1jaGFuZ2UtbWUtISE=}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Ready = answering HTTP: `up --wait` and the gateway wait for it (no request races start-up).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  ai-worker:
    restart: unless-stopped
    profiles: ["ai"]
    build: {context: .., dockerfile: services/Dockerfile, args: {SERVICE: ai}}
    command: ["python", "-m", "app.jobs"]
    environment:
      <<: *python-env
      CRUX_DATABASE_URL: mysql+aiomysql://crux_ai:${CRUX_AI_DB_PASSWORD:-crux-ai}@mysql:3306/crux_ai
      CRUX_SERVICE_NAME: ai
      CRUX_KMS_MASTER_KEY: ${CRUX_KMS_MASTER_KEY:-ZGV2LW9ubHktbWFzdGVyLWtleS1jaGFuZ2UtbWUtISE=}
    depends_on: [ai]

volumes:
  mysql-data:
  s3-data:
