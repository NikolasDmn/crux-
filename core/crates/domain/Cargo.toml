[package]
name = "crux-domain"
version.workspace = true
edition.workspace = true
publish = false

# Pure rules: no I/O, no clock, no randomness (backend-spec 2.1). Callers inject `now` and rngs.
[dependencies]
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
# Schema metadata only (derive), so request types can appear in the OpenAPI document.
utoipa.workspace = true
rand.workspace = true
rand_chacha = "0.3"
fsrs = { version = "6.6", default-features = false }
