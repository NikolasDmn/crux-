[project]
name = "crux-files"
version = "0.1.0"
description = "Upload, scan, PDF text/OCR, thumbnails, crops, storage saver, quotas (backend-spec 6)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "crux-common",
    "boto3>=1.35",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
]

[tool.uv.sources]
crux-common = { workspace = true }

# Virtual member: contributes dependencies only. The code is the top-level `app` package, run
# from this directory (uvicorn app.main:app), so the three services never share an import path.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
