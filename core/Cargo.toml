[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
crux-domain = { path = "crates/domain" }
crux-repo = { path = "crates/repo" }
crux-clients = { path = "crates/clients" }
crux-service = { path = "crates/service" }
crux-jobs = { path = "crates/jobs" }
crux-api = { path = "crates/api" }
crux-testkit = { path = "crates/testkit" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
futures = "0.3"
hex = "0.4"
http = "1"
jsonschema = { version = "0.26", default-features = false }
jsonwebtoken = "9"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "streams", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ulid = { version = "1", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"

[profile.dev.package."*"]
opt-level = 1
