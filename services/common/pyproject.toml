[project]
name = "crux-common"
version = "0.1.0"
description = "Shared plumbing for the Crux Python services: settings, DB, auth, errors, messaging"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "redis>=5.0",
    "python-ulid>=2.7",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crux_common"]
